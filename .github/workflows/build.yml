name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug
      - name: Inspect APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "=== RES FILES IN APK ==="
          unzip -l $APK | grep -Ei "mipmap|values" 
          AAPT=$(find /usr/local/lib/android/sdk/build-tools -name aapt2 -type f | sort -V | tail -1)
          echo "=== BADGING ==="
          $AAPT dump badging $APK | grep -E "package:|application:|application-label|application-icon" | head -10
      - uses: actions/upload-artifact@v4
        with:
          name: SCameraPro-debug
          path: app/build/outputs/apk/debug/app-debug.apk
